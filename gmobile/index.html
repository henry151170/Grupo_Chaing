<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Evaluación Postulantes G MOBILE</title>
<style>
:root{--primary:#2563eb;--primary-dark:#1e40af;--accent:#06b6d4;--card:#fff;--text:#1f2937;--muted:#6b7280;--border:#e5e7eb;--good:#10b981;--warn:#f59e0b;--bad:#ef4444;--wa:#25d366;}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:linear-gradient(135deg,#eff6ff,#e0f2fe);color:var(--text);min-height:100vh;line-height:1.5;padding:16px}
.wrap{max-width:760px;margin:0 auto}
.header{text-align:center;padding:20px 10px 28px}
.header h1{font-size:22px;color:var(--primary-dark);margin-bottom:6px}
.header p{color:var(--muted);font-size:14px}
.card{background:var(--card);border-radius:16px;padding:26px;box-shadow:0 4px 24px rgba(37,99,235,.08);margin-bottom:18px}
h2{font-size:18px;color:var(--primary-dark);margin-bottom:14px}
h3{font-size:15px;color:var(--primary-dark);margin:16px 0 8px}
label{display:block;font-size:13px;font-weight:600;margin-bottom:6px;color:#374151}
input,select,textarea{width:100%;padding:11px 13px;border:1.5px solid var(--border);border-radius:10px;font-size:14px;font-family:inherit;background:#fff;color:var(--text)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(37,99,235,.12)}
textarea{resize:vertical;min-height:90px}
.field{margin-bottom:15px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:560px){.row{grid-template-columns:1fr}}
.btn{display:inline-block;padding:13px 26px;border:none;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer;transition:.15s;background:var(--primary);color:#fff;text-align:center;text-decoration:none}
.btn:hover{background:var(--primary-dark);transform:translateY(-1px)}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.btn-ghost{background:#fff;color:var(--primary);border:1.5px solid var(--primary)}
.btn-full{width:100%}
.btn-wa{background:var(--wa);font-size:17px;padding:18px 26px;box-shadow:0 6px 20px rgba(37,211,102,.35)}
.btn-mail{background:#ea4335;color:#fff}
.opt{display:block;padding:14px 16px;border:1.5px solid var(--border);border-radius:10px;margin-bottom:10px;cursor:pointer;font-size:14px;transition:.15s;background:#fff}
.opt:hover{border-color:var(--primary);background:#eff6ff}
.opt.sel{border-color:var(--primary);background:#dbeafe;font-weight:600}
.opt input{display:none}
.progress{height:6px;background:#e5e7eb;border-radius:99px;overflow:hidden;margin-bottom:18px}
.progress > div{height:100%;background:linear-gradient(90deg,var(--primary),var(--accent));transition:.3s}
.chip{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:600}
.chip.good{background:#d1fae5;color:#065f46}
.chip.warn{background:#fef3c7;color:#92400e}
.chip.bad{background:#fee2e2;color:#991b1b}
.notice{background:#fef3c7;border-left:4px solid var(--warn);padding:12px 14px;border-radius:8px;font-size:13px;margin-bottom:16px;color:#78350f}
.notice.info{background:#dbeafe;border-color:var(--primary);color:#1e3a8a}
.notice.danger{background:#fee2e2;border-color:var(--bad);color:#7f1d1d}
.notice.success{background:#d1fae5;border-color:var(--good);color:#065f46}
.notice.big{font-size:15px;padding:18px;line-height:1.7}
.timer{font-size:34px;font-weight:700;color:var(--accent);text-align:center;margin:10px 0}
.timer-bar{height:8px;background:#e5e7eb;border-radius:99px;overflow:hidden;margin:8px 0 18px}
.timer-bar > div{height:100%;background:linear-gradient(90deg,var(--accent),var(--bad));transition:width .3s linear}
.mem-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:18px 0}
.mem-card{background:linear-gradient(135deg,#dbeafe,#eff6ff);border:2px solid #bfdbfe;border-radius:16px;padding:18px 12px;text-align:center}
.mem-card .emoji{font-size:52px;line-height:1;display:block;margin-bottom:8px}
.mem-card .nom{font-size:12px;color:var(--muted);margin-bottom:6px;font-weight:600;text-transform:uppercase}
.mem-card .precio{font-size:22px;font-weight:800;color:var(--primary-dark)}
.counter{font-size:12px;color:var(--muted);text-align:right;margin-top:4px}
.code-box{background:#1f2937;color:#a7f3d0;padding:14px;border-radius:10px;font-family:monospace;font-size:11px;word-break:break-all;max-height:140px;overflow:auto;margin:10px 0}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:9px 8px;text-align:left;border-bottom:1px solid var(--border)}
th{background:#f9fafb;font-weight:600;color:#374151;font-size:12px;text-transform:uppercase}
.admin-link{text-align:center;margin-top:22px;font-size:12px;color:var(--muted)}
.admin-link a{color:var(--muted);text-decoration:none;cursor:pointer}
.tag{display:inline-block;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:700;margin-right:4px}
.tag.p{background:#fee2e2;color:#991b1b}
.tag.g{background:#d1fae5;color:#065f46}
.detail{background:#f9fafb;border-radius:10px;padding:14px;margin:10px 0;font-size:13px}
.detail h4{font-size:13px;color:var(--primary-dark);margin:10px 0 6px}
.detail .qa{margin-bottom:8px}
.detail .qa .q{font-weight:600;color:#374151}
.detail .qa .a{color:var(--muted)}
.psy-box{background:linear-gradient(135deg,#dbeafe,#fef3c7);border:2px solid var(--primary);border-radius:14px;padding:18px;margin:14px 0}
.psy-box h4{font-size:14px;color:var(--primary-dark);margin-bottom:8px;letter-spacing:.5px}
.psy-dim{margin-bottom:12px}
.psy-dim label{display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px;color:#374151;font-weight:700}
.psy-dim label b{color:var(--primary-dark)}
.psy-bar{height:22px;background:#e5e7eb;border-radius:99px;overflow:hidden;position:relative}
.psy-bar > div{height:100%;border-radius:99px;transition:width .6s ease;display:flex;align-items:center;justify-content:flex-end;padding-right:8px;color:#fff;font-size:11px;font-weight:800}
.psy-narrative{background:#fff;border-radius:10px;padding:14px;font-size:13px;line-height:1.7;color:#374151;margin-top:10px;border-left:4px solid var(--primary)}
.psy-narrative b{color:var(--primary-dark)}
.gating{background:#fee2e2;border:2px solid var(--bad);border-radius:12px;padding:16px;margin:12px 0;color:#7f1d1d}
.gating h5{font-size:15px;margin-bottom:8px;font-weight:800;color:#991b1b}
.gating ul{margin-left:20px;font-size:13px;line-height:1.7}
.ctx-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
.ctx-card{background:#fff;border-radius:10px;padding:12px;font-size:12px}
.ctx-card .lbl{color:var(--muted);text-transform:uppercase;font-size:10px;font-weight:700}
.ctx-card .val{font-size:16px;font-weight:800;color:var(--primary-dark);margin:4px 0}
.ctx-card .det{color:var(--muted);font-size:11px}
.success-icon{font-size:76px;line-height:1;display:inline-block;margin-bottom:6px}
</style>
</head>

function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function $(id){return document.getElementById(id);}
function render(html){$('app').innerHTML=html;}
function encodeRes(o){return btoa(unescape(encodeURIComponent(JSON.stringify(o))));}
function decodeRes(c){try{return JSON.parse(decodeURIComponent(escape(atob(c.trim()))));}catch(e){return null;}}
function emailYaUsado(email){try{const l=JSON.parse(localStorage.getItem('postulantes_gmobile')||'[]');return l.some(r=>(r.correo||'').toLowerCase().trim()===email.toLowerCase().trim());}catch(e){return false;}}

let SECCIONES_ORDEN=[];
function vTest(idx){
  if(!SECCIONES_ORDEN.length){
    SECCIONES_ORDEN=[
      {nombre:'Temperamento social',preguntas:PREGUNTAS_TEMPERAMENTO,bucket:'temperamento'},
      {nombre:'Compromiso',preguntas:PREGUNTAS_COMPROMISO,bucket:'compromiso'},
      {nombre:'Persuasión',preguntas:PREGUNTAS_PERSUASION,bucket:'persuasion'},
      {nombre:'Tolerancia al trabajo',preguntas:PREGUNTAS_TOLERANCIA,bucket:'tolerancia'},
      {nombre:'Ética',preguntas:PREGUNTAS_ETICA,bucket:'etica'},
      {nombre:'Conocimiento tech',preguntas:PREGUNTAS_TECNICO,bucket:'tecnico',next:vMemoria1}
    ];
  }
  if(idx>=SECCIONES_ORDEN.length){return vMemoria1();}
  const sec=SECCIONES_ORDEN[idx];
  if(!sec.contador)sec.contador=0;
  if(sec.contador>=sec.preguntas.length){
    sec.contador=0;
    if(sec.next)return sec.next();
    return vTest(idx+1);
  }
  const q=sec.preguntas[sec.contador];
  const ops=S.orden[q.id];
  const total=sec.preguntas.length;
  const prog=(sec.contador/total)*100;
  render(`
  <div class="card">
    <div class="progress"><div style="width:${prog}%"></div></div>
    <p style="font-size:12px;color:var(--muted);margin-bottom:8px">Sección ${idx+1}/6 — ${sec.nombre} · Pregunta ${sec.contador+1} de ${total}</p>
    <h2>${esc(q.texto)}</h2>
    <div id="opsG">${ops.map((o,k)=>`<label class="opt" onclick="selG('${sec.bucket}','${q.id}',${k},'${esc(o.t).replace(/'/g,"\\'")}',${o.p})">${esc(o.t)}</label>`).join('')}</div>
    <button class="btn" id="btnG" disabled onclick="advance(${idx})">Siguiente →</button>
  </div>`);
  window.selG=function(bucket,qid,k,txt,p){
    S.respuestas[bucket][qid]={txt,p};
    document.querySelectorAll('#opsG .opt').forEach(el=>el.classList.remove('sel'));
    document.querySelectorAll('#opsG .opt')[k].classList.add('sel');
    $('btnG').disabled=false;
  };
  window.advance=function(i){
    SECCIONES_ORDEN[i].contador++;
    vTest(i);
  };
}

function vCalculo(i){
  if(i>=PREGUNTAS_CALCULO.length){return vAbiertas();}
  const q=PREGUNTAS_CALCULO[i],ops=S.orden[q.id];
  render(`

    </div>
    <div class="timer-bar"><div id="barCalc" style="width:100%"></div></div>
    <h2>${esc(q.t)}</h2>
    <div id="opsCal">${ops.map((o,k)=>`<label class="opt" onclick="selCal('${q.id}',${k},'${esc(o.o)}',${o.i})">${esc(o.o)}</label>`).join('')}</div>
    <button class="btn" id="btnCal" disabled onclick="sigCal(${i})">Siguiente →</button>
  </div>`);
  window.selCal=function(qid,k,txt,origIdx){
    S.respuestas.calculo[qid]={txt,origIdx,correcta:PREGUNTAS_CALCULO.find(p=>p.id===qid).ok===origIdx};
    document.querySelectorAll('#opsCal .opt').forEach(el=>el.classList.remove('sel'));
    document.querySelectorAll('#opsCal .opt')[k].classList.add('sel');
    $('btnCal').disabled=false;
  };
  detenerTimerCalculo();
  S.timers.calculoRestante=TIEMPO_POR_CALCULO;
  S.timers.calculoInterval=setInterval(()=>{
    S.timers.calculoRestante--;
    const t=S.timers.calculoRestante,el=$('tmrCalc'),bar=$('barCalc');
    if(el){el.textContent=t;el.parentElement.style.color=t<=15?'var(--bad)':'var(--accent)';}
    if(bar){bar.style.width=(Math.max(t,0)/TIEMPO_POR_CALCULO*100)+'%';}
    if(t<=0){
      detenerTimerCalculo();
      S.timers.tiemposCalculo[i]=TIEMPO_POR_CALCULO;
      const qid=PREGUNTAS_CALCULO[i].id;
      if(!S.respuestas.calculo[qid])S.respuestas.calculo[qid]={txt:'(sin responder)',origIdx:-1,correcta:false};
      vCalculo(i+1);
    }
  },1000);
}
function sigCal(i){
  S.timers.tiemposCalculo[i]=TIEMPO_POR_CALCULO-S.timers.calculoRestante;
  detenerTimerCalculo();
  const qid=PREGUNTAS_CALCULO[i].id;
  if(!S.respuestas.calculo[qid])S.respuestas.calculo[qid]={txt:'(sin responder)',origIdx:-1,correcta:false};
  vCalculo(i+1);
}
function detenerTimerCalculo(){if(S.timers.calculoInterval){clearInterval(S.timers.calculoInterval);S.timers.calculoInterval=null;}}

/* ============ FINALIZAR ============ */
function finalizarTest(){
  const errBox=$('errMsg'),btnFin=$('btnFin');
  try{
    if(errBox)errBox.style.display='none';
    if(btnFin){btnFin.disabled=true;btnFin.textContent='Procesando...';}
    detenerTimerCalculo();
    const tas=document.querySelectorAll('textarea[data-qid]');
    let vacia=null;
    for(const t of tas){if((t.value||'').trim().length<15){vacia=t;break;}}
    if(vacia){
      if(errBox){errBox.textContent='⚠️ Responde TODAS las preguntas abiertas con al menos una frase.';errBox.style.display='block';errBox.scrollIntoView({behavior:'smooth',block:'center'});}
      vacia.focus();
      if(btnFin){btnFin.disabled=false;btnFin.textContent='Finalizar y enviar test';}
      return;
    }
    for(const t of tas){S.respuestas.abiertas[t.dataset.qid]=t.value.trim();}

    S.flags.fin=Date.now();
    S.flags.tiempoTotal=Math.round((S.flags.fin-S.flags.inicio)/1000);

    const sum=(arr,b)=>{let s=0,m=0;arr.forEach(q=>{s+=(S.respuestas[b][q.id]?.p??0);m+=3;});return[s,m];};
    const [pTemp,maxTemp]=sum(PREGUNTAS_TEMPERAMENTO,'temperamento');
    const [pComp,maxComp]=sum(PREGUNTAS_COMPROMISO,'compromiso');
    const [pPers,maxPers]=sum(PREGUNTAS_PERSUASION,'persuasion');
    const [pTol,maxTol]=sum(PREGUNTAS_TOLERANCIA,'tolerancia');
    const [pEti,maxEti]=sum(PREGUNTAS_ETICA,'etica');
    const [pTec,maxTec]=sum(PREGUNTAS_TECNICO,'tecnico');
    let pMem=0;Object.values(S.respuestas.memoria).forEach(m=>{if(m.correcta)pMem++;});
    let pCal=0;Object.values(S.respuestas.calculo).forEach(c=>{if(c.correcta)pCal++;});

    const flags=[];
    if(S.flags.tiempoTotal<TIEMPO_MINIMO_TEST)flags.push('Tiempo muy bajo ('+S.flags.tiempoTotal+'s) — posible uso de IA.');
    if(S.flags.tab>2)flags.push('Cambios de pestaña ('+S.flags.tab+').');
    if(S.flags.paste>0)flags.push('Intento(s) de pegar ('+S.flags.paste+').');
    if(S.registro.modalidad==='Full time'&&S.registro.permanencia==='3 meses')flags.push('Full time con permanencia de solo 3 meses.');

    const psico=auditar({pTemp,maxTemp,pComp,maxComp,pPers,maxPers,pTol,maxTol,pEti,maxEti,pTec,maxTec,pMem,pCal,flags,S});

    const resultado={
      ...S.registro,fecha:new Date().toISOString(),
      puntajes:{
        temperamento:pTemp,maxTemperamento:maxTemp,
        compromiso:pComp,maxCompromiso:maxComp,
        persuasion:pPers,maxPersuasion:maxPers,
        tolerancia:pTol,maxTolerancia:maxTol,
        etica:pEti,maxEtica:maxEti,
        tecnico:pTec,maxTecnico:maxTec,
        memoria:pMem,maxMemoria:PREGUNTAS_MEMORIA.length,
        calculo:pCal,maxCalculo:PREGUNTAS_CALCULO.length
      },
      respuestas:S.respuestas,flags,
      flagCount:{tab:S.flags.tab,paste:S.flags.paste,tiempoTotal:S.flags.tiempoTotal},
      abiertas:S.respuestas.abiertas,psicometrico:psico
    };

    try{const l=JSON.parse(localStorage.getItem('postulantes_gmobile')||'[]');l.push(resultado);localStorage.setItem('postulantes_gmobile',JSON.stringify(l));}catch(e){}

    const code=encodeRes(resultado);
    window.__lastResult=resultado;
    const waMsg=`Hola G MOBILE 👋\n\nTerminé el test.\n\n👤 *Nombre:* ${S.registro.nombre}\n📋 *Modalidad:* ${S.registro.modalidad}\n⏰ *Turno:* ${S.registro.turno}\n📍 *Distrito:* ${S.registro.distrito}\n💰 *Aspiración:* S/ ${S.registro.sueldo}\n\n*Código:*\n${code}\n\n¡Gracias!`;
    const waUrl=`https://wa.me/${STORE_WHATSAPP}?text=${encodeURIComponent(waMsg)}`;
    const mailUrl=`mailto:${STORE_EMAIL}?subject=${encodeURIComponent('Postulación G MOBILE — '+S.registro.nombre)}&body=${encodeURIComponent(waMsg.replace(/\*/g,''))}`;

    render(`
    <div class="card" style="text-align:center">
      <span class="success-icon">🎉</span>
      <h2>¡Test completado!</h2>
      <p style="color:var(--muted);font-size:14px;margin:10px auto 24px;max-width:480px">Tu evaluación fue registrada. Envíala a G Mobile con un solo toque.</p>
      <a href="${waUrl}" target="_blank" class="btn btn-wa btn-full">📱 Enviar por WhatsApp</a>
      <a href="${mailUrl}" class="btn btn-mail btn-full" style="margin-top:10px">📧 Enviar por correo</a>
      <div style="margin-top:22px"><button class="btn-ghost btn" onclick="toggleAv()"><span id="tg">▼ Ver opciones avanzadas</span></button></div>

      </div>

    window.scrollTo({top:0,behavior:'smooth'});
  }catch(err){
    console.error(err);
    if(errBox){errBox.innerHTML='⚠️ <b>Error:</b> '+(err.message||err);errBox.style.display='block';}

/* ============ AUDITORÍA ============ */
function auditar({pTemp,maxTemp,pComp,maxComp,pPers,maxPers,pTol,maxTol,pEti,maxEti,pTec,maxTec,pMem,pCal,flags,S}){
  const pct=(p,m)=>m?Math.max(0,Math.min(100,(p/m)*100)):0;
  const pctTemp=pct(pTemp,maxTemp);
  const pctComp=pct(pComp,maxComp);
  const pctPers=pct(pPers,maxPers);
  const pctTol=pct(pTol,maxTol);
  const pctEti=pct(pEti,maxEti);
  const pctTec=pct(pTec,maxTec);
  const pctMem=(pMem/PREGUNTAS_MEMORIA.length)*100;
  const pctCal=(pCal/PREGUNTAS_CALCULO.length)*100;

  const distrito=S.registro.distrito||'';
  const cercaniaScore=PROXIMIDAD[distrito]??30;
  const sueldoPedido=+S.registro.sueldo||0;
  const modalidad=S.registro.modalidad;
  let expScore=0,expNota='';
  if(modalidad==='Full time'){
    if(sueldoPedido>=1200&&sueldoPedido<=1600){expScore=100;expNota='Alineada (~S/ 1,400).';}
    else if(sueldoPedido>=1000&&sueldoPedido<1200){expScore=75;expNota='Algo por debajo; aceptable.';}
    else if(sueldoPedido>1600&&sueldoPedido<=1900){expScore=70;expNota='Ligeramente por encima; negociable.';}
    else if(sueldoPedido<1000){expScore=45;expNota='Muy baja: riesgo de rotación.';}
    else{expScore=35;expNota='Muy por encima del presupuesto.';}
  }else{
    if(sueldoPedido>=700&&sueldoPedido<=950){expScore=100;expNota='Alineada (~S/ 850).';}
    else if(sueldoPedido>=550&&sueldoPedido<700){expScore=75;expNota='Algo por debajo; aceptable.';}
    else if(sueldoPedido>950&&sueldoPedido<=1150){expScore=70;expNota='Ligeramente por encima.';}
    else if(sueldoPedido<550){expScore=45;expNota='Muy baja: riesgo de rotación.';}
    else{expScore=35;expNota='Muy por encima.';}
  }

  const penal=flags.length*5;
  const penalizar=v=>Math.max(0,Math.min(100,v-penal*0.4));

  const pesoPerfil = pctTemp*0.25 + pctComp*0.20 + pctPers*0.15 + pctTol*0.15;
  const pesoOtros = pctEti*0.10 + pctTec*0.05 + pctMem*0.025 + pctCal*0.025 + cercaniaScore*0.025 + expScore*0.025;
  const scoreGlobal = penalizar(pesoPerfil + pesoOtros);

  const gateIssues=[];
  if(pctTemp<55) gateIssues.push('Temperamento social bajo ('+Math.round(pctTemp)+'%): no demuestra iniciativa social ni comodidad al interactuar con clientes. En la práctica se verá como una persona distante o apagada.');
  if(pctComp<55) gateIssues.push('Compromiso bajo ('+Math.round(pctComp)+'%): no demuestra necesidad real de trabajar ni intención de permanecer.');
  if(pctPers<50) gateIssues.push('Persuasión natural baja ('+Math.round(pctPers)+'%): no busca agregar valor al cliente, no sugiere alternativas ni cierra ventas adicionales.');
  if(pctTol<50) gateIssues.push('Baja tolerancia al trabajo real ('+Math.round(pctTol)+'%): se aburrirá en los tiempos muertos.');
  if(pctEti<60) gateIssues.push('Señales de riesgo ético ('+Math.round(pctEti)+'%).');
  if(pctTec<40) gateIssues.push('Conocimiento del rubro muy bajo ('+Math.round(pctTec)+'%): no maneja conceptos básicos de accesorios tech.');

  const perfilBloqueado = gateIssues.length>0;

  let perfil,perfilColor;
  if(perfilBloqueado){perfil='NO RECOMENDADO — No cumple el perfil mínimo';perfilColor='bad';}
  else if(scoreGlobal>=78&&flags.length===0){perfil='PERFIL IDEAL — Vendedor(a) estrella tech';perfilColor='good';}
  else if(scoreGlobal>=65){perfil='PERFIL PROMETEDOR — Requiere validación';perfilColor='warn';}
  else if(scoreGlobal>=50){perfil='PERFIL MODERADO — Evaluar con cuidado';perfilColor='warn';}
  else{perfil='NO RECOMENDADO';perfilColor='bad';}

  const fortalezas=[];
  if(pctTemp>=75)fortalezas.push('Temperamento extrovertido: inicia conversaciones con naturalidad, genera cercanía con los clientes.');
  if(pctComp>=75)fortalezas.push('Compromiso real con el trabajo: necesidad económica clara y disposición a permanecer.');
  if(pctPers>=75)fortalezas.push('Vendedor(a) natural: agrega valor al cliente, sugiere combos, cierra ventas adicionales.');
  if(pctTol>=75)fortalezas.push('Tolerancia alta al trabajo real: sabe qué esperar y se autorregula en tiempos muertos.');
  if(pctEti>=85)fortalezas.push('Ética sólida en el manejo de dinero y equipos de valor.');
  if(pctTec>=75)fortalezas.push('Buen conocimiento de productos tech: maneja conceptos de conectores, velocidades y compatibilidades.');

  const riesgos=[];
  if(pctTemp<55)riesgos.push('Riesgo de actitud distante con los clientes.');
  if(pctComp<55)riesgos.push('Riesgo de rotación temprana.');
  if(pctPers<50)riesgos.push('Riesgo de no vender más allá de lo que el cliente pide.');
  if(pctTol<50)riesgos.push('Riesgo de aburrimiento y desmotivación en horarios de calma.');
  if(pctTec<50)riesgos.push('Requiere capacitación intensiva en productos tech.');
  if(cercaniaScore<50)riesgos.push('Distrito lejano ('+distrito+'): riesgo de tardanzas.');
  if(expScore<55)riesgos.push('Expectativa salarial no alineada: '+expNota);

  const nombre=(S.registro.nombre||'').split(' ')[0]||'El postulante';
  let narrativa=`<b>${nombre}</b> obtiene un score global de <b>${Math.round(scoreGlobal)}/100</b>. `;
  if(perfilBloqueado){
    narrativa+=`<b style="color:#991b1b">Sin embargo, NO cumple con los mínimos críticos del perfil y se marca como NO RECOMENDADO.</b> Los filtros automáticos detectaron las siguientes alertas:`;
  } else {
    narrativa+=`Las dimensiones críticas para este puesto (temperamento, compromiso, persuasión y tolerancia) están dentro de los rangos esperados. `;
  }
  narrativa+=`<br><br><b>📊 Desglose:</b><br>`;
  narrativa+=`• Temperamento social: <b>${Math.round(pctTemp)}%</b> — ${pctTemp>=75?'excelente, sociable y proactivo(a)':pctTemp>=55?'aceptable, con margen de mejora':'BAJO — perfil reservado, no apto para este puesto'}<br>`;
  narrativa+=`• Compromiso y motivación: <b>${Math.round(pctComp)}%</b> — ${pctComp>=75?'sólido, con necesidad real de trabajar':pctComp>=55?'aceptable':'BAJO — sin urgencia ni compromiso claro'}<br>`;
  narrativa+=`• Persuasión natural: <b>${Math.round(pctPers)}%</b> — ${pctPers>=75?'vendedor(a) natural':pctPers>=50?'puede desarrollar la habilidad':'BAJO — no busca agregar valor al cliente'}<br>`;
  narrativa+=`• Tolerancia al trabajo real: <b>${Math.round(pctTol)}%</b> — ${pctTol>=75?'entiende y acepta el ritmo real del puesto':pctTol>=50?'aceptable, con riesgo moderado':'BAJO — se aburrirá y mostrará incomodidad'}<br>`;
  narrativa+=`• Ética: <b>${Math.round(pctEti)}%</b> · Conocimiento tech: <b>${Math.round(pctTec)}%</b> · Memoria: <b>${Math.round(pctMem)}%</b> · Cálculo: <b>${Math.round(pctCal)}%</b><br>`;
  narrativa+=`<br><b>📍 Contexto:</b> Reside en <b>${esc(distrito)}</b> (cercanía: ${cercaniaScore}/100). Espera sueldo de <b>S/ ${sueldoPedido}</b> (${modalidad}). ${expNota}`;
  if(flags.length){narrativa+=`<br><br><b>⚠️ Alertas del test:</b> `+flags.join(' ');}
  else{narrativa+=`<br><br><b>✅ Sin alertas de integridad.</b>`;}
  narrativa+=`<br><br><b>Recomendación:</b> `;
  if(perfilBloqueado){narrativa+=`<b style="color:#991b1b">NO avanzar.</b> Este(a) postulante no cumple con el perfil crítico requerido. Podrías considerarlo(a) para roles sin trato directo al público (almacén, logística), pero NO para atención al cliente.`;}
  else if(scoreGlobal>=75&&flags.length===0){narrativa+=`Avanzar a <b>entrevista presencial</b> y prueba en tienda de 30 min (recepción al público) + 2 h (técnica). Alta probabilidad de encaje.`;}
  else if(scoreGlobal>=60){narrativa+=`Citar a entrevista para validar las dimensiones con margen de mejora. Considerar prueba en tienda supervisada de 30 min.`;}
  else if(scoreGlobal>=45){narrativa+=`Mantener como reserva. Citar solo si no hay mejores candidatos.`;}
  else{narrativa+=`Descartar para atención al cliente.`;}

  return {
    dimensiones:{
      'Temperamento social':Math.round(pctTemp),
      'Compromiso real':Math.round(pctComp),
      'Persuasión natural':Math.round(pctPers),
      'Tolerancia al trabajo':Math.round(pctTol),
      'Ética':Math.round(pctEti),
      'Conocimiento tech':Math.round(pctTec),
      'Memoria visual':Math.round(pctMem),
      'Cálculo':Math.round(pctCal),
      'Cercanía al centro':Math.round(cercaniaScore),
      'Ajuste salarial':Math.round(expScore)
    },
    criticas:['Temperamento social','Compromiso real','Persuasión natural','Tolerancia al trabajo'],
    promedio:Math.round(scoreGlobal),
    combinado:Math.round(scoreGlobal),
    perfil,perfilColor,fortalezas,riesgos,narrativa,
    gateIssues,
    perfilBloqueado,
    contexto:{distrito,cercaniaScore,sueldoPedido,expectativaScore:expScore,expectativaNota:expNota,modalidad}
  };
}

function renderDetalle(r){

  if(r.psicometrico){

      const borde=esCritica?'border-left:4px solid #2563eb;padding-left:8px':'';
      return `<div class="psy-dim" style="${borde}">
        <label><span>${esCritica?'⭐ ':''}${k}${esCritica?' <small style="color:#2563eb">(crítica)</small>':''}</span><b>${v}/100</b></label>
        <div class="psy-bar"><div style="width:${v}%;background:${color}">${v>=25?v:''}</div></div>
      </div>`;
    }).join('');

    const gatingHTML = p.perfilBloqueado && p.gateIssues?.length ? `
      <div class="gating">
        <h5>🚫 FILTROS CRÍTICOS ACTIVADOS</h5>
        <p style="font-size:13px;margin-bottom:8px">Este(a) postulante <b>no cumple con los mínimos del perfil</b> para atención al público:</p>
        <ul>${p.gateIssues.map(g=>`<li>${esc(g)}</li>`).join('')}</ul>
      </div>` : '';

    const ctx=p.contexto;
    const ctxHTML=`<div class="ctx-grid">
      <div class="ctx-card"><div class="lbl">📍 Distrito</div><div class="val">${esc(ctx.distrito)}</div><div class="det">Cercanía: <b>${ctx.cercaniaScore}/100</b></div></div>
      <div class="ctx-card"><div class="lbl">💰 Sueldo esperado</div><div class="val">S/ ${ctx.sueldoPedido}</div><div class="det">Ajuste: <b>${ctx.expectativaScore}/100</b></div></div>
    </div>`;

    psicoHTML=`
      <div class="psy-box">
        <h4>🤖 AUDITORÍA PSICOMÉTRICA</h4>
        <p style="font-size:14px;margin-bottom:12px"><span class="chip ${p.perfilColor}">${esc(p.perfil)}</span> &nbsp;·&nbsp; Score global: <b>${p.promedio}/100</b></p>
        ${gatingHTML}
        ${ctxHTML}
        <div style="margin-top:10px">${dims}</div>
        ${p.fortalezas.length?`<div style="margin-top:12px"><b style="color:#065f46;font-size:13px">✅ Fortalezas</b><ul style="margin-left:18px;font-size:13px;line-height:1.7">${p.fortalezas.map(f=>`<li>${esc(f)}</li>`).join('')}</ul></div>`:''}

      </div>`;
  }
  return `
  <div class="detail" style="margin-top:20px;border:2px solid var(--primary)">
    <h4 style="font-size:16px">👤 ${esc(r.nombre)}</h4>
    <p style="font-size:13px;color:var(--muted)">
      DNI: ${esc(r.dni)} · Edad: ${esc(r.edad)} · ${esc(r.distrito)} · ${esc(r.grado)}<br>
      📧 ${esc(r.correo)} · 📱 ${esc(r.telefono)}<br>
      Experiencia: <b>${esc(r.experiencia||'-')}</b><br>
      Modalidad: <b>${esc(r.modalidad)}</b> · Turno: ${esc(r.turno)} · Permanencia: ${esc(r.permanencia)}<br>
      Fecha: ${new Date(r.fecha).toLocaleString()}
    </p>
    ${psicoHTML}
    ${r.flags.length?`<h4>⚠️ Alertas del test</h4><ul style="margin-left:18px;font-size:13px;color:#991b1b">${r.flags.map(f=>`<li>${esc(f)}</li>`).join('')}</ul>`:''}
    <h4>Sección 1: Temperamento social ⭐</h4>${temp}
    <h4>Sección 2: Compromiso real ⭐</h4>${comp}
    <h4>Sección 3: Persuasión natural ⭐</h4>${pers}
    <h4>Sección 4: Tolerancia al trabajo ⭐</h4>${tol}
    <h4>Sección 5: Ética</h4>${eti}
    <h4>Sección 6: Conocimiento tech</h4>${tec}
    <h4>Sección 7: Memoria</h4>${mem}
    <h4>Sección 8: Cálculo</h4>${cal}
    <h4>Sección 9: Preguntas abiertas</h4>${ab}
  </div>`;
}
function exportCSV(){
  const l=JSON.parse(localStorage.getItem('postulantes_gmobile')||'[]');
  if(!l.length){alert('Sin registros.');return;}
  const head=['Fecha','Nombre','DNI','Edad','Correo','Telefono','Grado','Distrito','Experiencia','Modalidad','Permanencia','Turno','Disponibilidad','Sueldo','ScoreGlobal','Perfil','BLOQUEADO','Temperamento','Compromiso','Persuasion','Tolerancia','Etica','Tecnico','Memoria','Calculo','TiempoSeg','Pestanas','Pegados','Flags'];
  const rows=l.map(r=>{
    const d=r.psicometrico?.dimensiones||{};
    return [new Date(r.fecha).toLocaleString(),r.nombre,r.dni,r.edad,r.correo,r.telefono,r.grado,r.distrito,r.experiencia,r.modalidad,r.permanencia,r.turno,r.disponibilidad,r.sueldo,r.psicometrico?.promedio,r.psicometrico?.perfil,r.psicometrico?.perfilBloqueado?'SÍ':'NO',d['Temperamento social'],d['Compromiso real'],d['Persuasión natural'],d['Tolerancia al trabajo'],d['Ética'],d['Conocimiento tech'],d['Memoria visual'],d['Cálculo'],r.flagCount.tiempoTotal,r.flagCount.tab,r.flagCount.paste,r.flags.join(' | ')];
  });
  const csv=[head,...rows].map(r=>r.map(c=>`"${String(c??'').replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='postulantes_gmobile_'+Date.now()+'.csv';a.click();
}
document.addEventListener('visibilitychange',()=>{if(document.hidden)S.flags.tab++;});

vRegistro();
</script>
